<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wgpu FFT and NUFFT WASM demo</title>
    <style>
      body { max-width: 56rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
      button { padding: 0.55rem 0.9rem; }
      pre { padding: 1rem; overflow: auto; background: #111; color: #d8ffd8; }
    </style>
  </head>
  <body>
    <h1>wgpu FFT and NUFFT in Chrome WebGPU</h1>
    <p>The wrapper keeps plans and buffers GPU-resident until download.</p>
    <button id="runFft">Run C2C N=4</button>
    <button id="runNufft">Run type-1 NUFFT N=8</button>
    <pre id="output">Idle</pre>
    <script>
      // Browsers load neither JavaScript modules nor WebAssembly from file:// URLs.
      if (location.protocol === "file:") {
        for (const button of document.querySelectorAll("button")) button.disabled = true;
        document.querySelector("#output").textContent =
          "Open this page over HTTP; browsers do not load modules or WebAssembly from file:// URLs.\n" +
          "From the repository root, build the package and serve wgpu-web (see wgpu-web/README.md):\n\n" +
          "  wasm-pack build wgpu-web --target web --out-dir pkg\n" +
          "  python -m http.server 8000 --directory wgpu-web\n\n" +
          "then open http://localhost:8000/demo/";
      }
    </script>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
