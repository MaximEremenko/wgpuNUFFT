[package]
publish = false
name = "wgpu-web"
version = "0.3.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Minimal wasm-bindgen browser surface for wgpu-fft and wgpu-nufft"
readme = "README.md"
keywords = ["fft", "nufft", "wgpu", "webgpu", "wasm"]
categories = ["mathematics", "algorithms", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = "1.22"
futures-channel = "0.3"
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
wgpu = "30.0.1"
wgpu-fft = { path = "../wgpuFFT", version = "0.1.0", features = ["serde"] }
wgpu-nufft = { path = "..", version = "0.3.0" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
