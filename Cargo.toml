[workspace]
members = ["wgpu-web", "python", "capi"]
default-members = [".", "wgpu-web", "capi"]
exclude = ["wgpuFFT"]
resolver = "2"

[package]
publish = false
name = "wgpu-nufft"
version = "0.3.2"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Portable GPU NUFFT plans built on wgpu-fft."
readme = "README.md"
keywords = ["nufft", "fft", "wgpu", "webgpu", "gpu"]
categories = ["mathematics", "algorithms", "wasm"]

[features]
default = ["cpu"]
# Host-memory plans (`CpuNufftPlan`) on wgpu-fft's CPU FFT.
cpu = ["wgpu-fft/cpu"]
gpu-profiling = []
type1-2d-tile-prototype = []
type1-3d-tile-prototype = []

[lib]
name = "wgpu_nufft"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.22", features = ["extern_crate_alloc", "zeroable_atomics"] }
wgpu = "30.0.1"
wgpu-fft = { path = "wgpuFFT", version = "0.1.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
futures-channel = "0.3"
wasm-bindgen-test = "=0.3.79"

[[bench]]
name = "nufft_bench"
harness = false

[[bench]]
name = "nufft_2d_bench"
harness = false

[[bench]]
name = "nufft_batch_bench"
harness = false

[[bench]]
name = "nufft_precision_bench"
harness = false

[[bench]]
name = "nufft_stage_profile"
harness = false
required-features = ["gpu-profiling"]

[[bench]]
name = "nufft_cpu_bench"
harness = false
required-features = ["cpu"]
