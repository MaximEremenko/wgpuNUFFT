[package]
name = "wgpu-nufft-c"
version = "0.3.1"
edition = "2021"
rust-version = "1.92"
publish = false
license = "Apache-2.0"
description = "C interface to wgpu-nufft, under its Fortran and MATLAB interfaces"

[lib]
name = "wgpu_nufft_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bytemuck = "1.22"
pollster = "0.4"
wgpu-nufft = { path = "..", version = "0.3.1" }
