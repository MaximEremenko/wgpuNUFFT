name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Hosted runners have no GPU, so the opt-in GPU suites skip themselves; run
# them locally with WGPU_FFT_RUN_GPU_TESTS=1 as the README describes.
jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # PyO3's build script needs an interpreter to lint the Python binding.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features
      - run: cargo test --locked --manifest-path wgpuFFT/Cargo.toml

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --all-features

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p wgpu-nufft -p wgpu-web --target wasm32-unknown-unknown --all-targets

  # The standalone browser build is not checked in: every run uploads it as
  # the wgpu_web artifact, and a v* tag attaches it to the tag's release.
  browser:
    name: Browser build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        # The CLI must match the wasm-bindgen crate in Cargo.lock.
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: python3 wgpu-web/build_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: wgpu_web
          path: wgpu-web/dist/wgpu_web.js
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout holds the tag without its annotation, whose message
          # --notes-from-tag reads; fetch the annotated tag itself.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" wgpu-web/dist/wgpu_web.js --clobber

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features

  python:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install "maturin==1.15.0" "numpy==2.5.2"
      - name: Rust tests
        run: |
          export PYO3_PYTHON="$(command -v python)"
          cargo test --locked -p wgpu-nufft-python
      # Building the wheel checks the packaging. The GPU tests need an
      # adapter; the CPU tests run here.
      - run: maturin build --release --manifest-path python/Cargo.toml
      - name: CPU tests
        run: |
          python -m pip install "pytest==9.1.1" target/wheels/*.whl
          python -m pytest python/tests/test_cpu.py -q
